  <g font-family="Arial, sans-serif" font-size="13" letter-spacing="2" fill="#777">
    <text x="62" y="678">CLASSIFY / CONNECT / VALIDATE</text><text x="1138" y="678" text-anchor="end">ILLUSTRATIVE WORKFLOW</text>
  </g>
</svg>
