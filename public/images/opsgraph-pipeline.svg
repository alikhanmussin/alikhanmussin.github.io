  <text x="860" y="420" fill="#aaa" font-family="Arial, sans-serif" font-size="15" letter-spacing="1.5">HISTORICAL CONTEXT</text>
  <g fill="none" stroke="#666"><rect x="861" y="444" width="31" height="40" rx="3"/><rect x="900" y="444" width="31" height="40" rx="3"/><rect x="939" y="444" width="31" height="40" rx="3"/></g>
  <path d="M868 456h17m-17 8h12m22-8h17m-17 8h12m22-8h17m-17 8h12" stroke="#888"/>
  <text x="990" y="464" fill="#ddd" font-family="Arial, sans-serif" font-size="18">Similar cases</text>
  <rect x="501" y="441" width="190" height="26" fill="#0e0e0e"/>
